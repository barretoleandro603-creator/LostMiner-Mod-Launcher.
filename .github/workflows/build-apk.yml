name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          mkdir source
          unzip -o *.zip -d source

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle -p source/LostMiner_Mod_Launcher_Completo assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LostMiner-APK
          path: source/LostMiner_Mod_Launcher_Completo/app/build/outputs/apk/debug/app-debug.apk
